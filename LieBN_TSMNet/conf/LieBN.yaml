defaults:
  - _self_
  - dataset: hinss2021

  #评估方式：跨session测试+无监督适应+标签被mask掉
  - evaluation: inter-session+uda
  - preprocessing: bb4-36Hz
  
  #模型所在路径
  - nnet: tsmnet_spddsmbn
  - override hydra/launcher: joblib
fit:
  stratified: True
  epochs: 50
  batch_size_train: 50
  #一个batch包含5个domain，这些domain和session（subject）相关
  domains_per_batch: 5
  batch_size_test: -1
  # 20%的训练集数据拿出来做验证集
  validation_size: 0.2 #0.1 # float <1 for fraction; int for specific number
  #每次留5%的domain做测试集
  test_size: 0.05 # percent of groups/domains used for testing

saving_model:
  is_save_model: False
  is_save_results_each_fold: True
#评价指标 
score: balanced_accuracy # sklearn scores
device: GPU
threadnum: 1
data_dir: /data
is_debug: False
seed: 42
is_timing: False

hydra:
  run:
    dir: outputs/${dataset.name}/${evaluation.strategy}
  sweep:
    dir: outputs/${dataset.name}/${evaluation.strategy}
    subdir: '.'
  launcher:
    n_jobs: -1
  job_logging:
    handlers:
      file:
        class: logging.FileHandler
        filename: default.log
#  job:
#    num_threads: 2
